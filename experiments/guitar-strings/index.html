<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playable Guitar Strings</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f0df;
      --muted: #b9c6bc;
      --panel: rgba(11, 14, 16, 0.74);
      --panel-strong: rgba(5, 7, 9, 0.88);
      --line: rgba(255, 255, 255, 0.16);
      --gold: #f2c14e;
      --teal: #45d6c5;
      --rose: #f0786d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, #030608 0%, #071014 44%, #030507 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 11vw),
        radial-gradient(ellipse at 50% 48%, rgba(255, 255, 255, 0.045), transparent 34%),
        radial-gradient(ellipse at 50% 50%, transparent 0 32%, rgba(0, 0, 0, 0.7) 86%);
      opacity: 0.76;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
    }

    .topbar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(940px, calc(100vw - 28px));
      min-height: 56px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(18px) saturate(1.2);
      transform: translateX(-50%);
    }

    .brand {
      min-width: 128px;
      padding: 2px 6px 2px 2px;
    }

    .brand strong {
      display: block;
      font-size: 0.94rem;
      line-height: 1.05;
    }

    .brand span,
    .status {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.25;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .controls.chords {
      flex: 1 1 auto;
    }

    .controls.riffs {
      flex: 0 0 auto;
    }

    button {
      appearance: none;
      min-width: 44px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:hover {
      border-color: rgba(242, 193, 78, 0.62);
      background: rgba(242, 193, 78, 0.16);
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }

    button[aria-pressed="true"] {
      border-color: rgba(242, 193, 78, 0.8);
      background: rgba(242, 193, 78, 0.24);
      color: #fff7dc;
    }

    .stop {
      color: #ffe7e2;
    }

    .status {
      flex: 0 1 180px;
      min-width: 116px;
      text-align: right;
    }

    .help {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2;
      max-width: min(530px, calc(100vw - 28px));
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: var(--panel-strong);
      color: rgba(245, 240, 223, 0.78);
      font-size: 0.77rem;
      line-height: 1.35;
      backdrop-filter: blur(14px);
    }

    .flash {
      position: fixed;
      left: 50%;
      bottom: max(54px, calc(env(safe-area-inset-bottom) + 54px));
      z-index: 3;
      padding: 8px 12px;
      border: 1px solid rgba(69, 214, 197, 0.35);
      border-radius: 8px;
      background: rgba(4, 13, 13, 0.78);
      color: #dffffb;
      font-size: 0.8rem;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .flash.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 760px) {
      .topbar {
        top: max(10px, env(safe-area-inset-top));
        align-items: stretch;
        flex-wrap: wrap;
        gap: 8px;
        padding: 9px;
      }

      .brand {
        min-width: 0;
        flex: 1 1 156px;
      }

      .controls {
        flex-wrap: wrap;
        gap: 6px;
      }

      .controls.chords,
      .controls.riffs {
        flex: 1 1 100%;
      }

      button {
        flex: 1 1 46px;
        min-width: 42px;
        height: 34px;
        padding: 0 9px;
        font-size: 0.82rem;
      }

      .status {
        flex: 1 1 160px;
        text-align: left;
      }

      .help {
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        max-width: none;
        font-size: 0.72rem;
      }
    }

    @media (max-height: 560px) {
      .help {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="guitar" aria-label="Interactive animated guitar strings"></canvas>

  <section class="topbar" aria-label="Guitar controls">
    <div class="brand">
      <strong>Guitar Strings</strong>
      <span>Pluck, drag, strum.</span>
    </div>
    <div class="controls chords" aria-label="Chords">
      <button type="button" data-chord="C" aria-pressed="false">C</button>
      <button type="button" data-chord="G" aria-pressed="true">G</button>
      <button type="button" data-chord="D" aria-pressed="false">D</button>
      <button type="button" data-chord="Em" aria-pressed="false">Em</button>
      <button type="button" data-chord="Am" aria-pressed="false">Am</button>
      <button type="button" data-chord="F" aria-pressed="false">F</button>
    </div>
    <div class="controls riffs" aria-label="Riffs">
      <button type="button" data-riff="sunrise">Sunrise</button>
      <button type="button" data-riff="drift">Drift</button>
      <button class="stop" type="button" data-stop>Stop</button>
    </div>
    <div class="status" id="status" aria-live="polite">Selected: G</div>
  </section>

  <div class="help">Keys: 1-6 pluck strings, Q W E R T Y choose chords, Space strums, Esc stops riffs.</div>
  <div class="flash" id="flash">Audio ready</div>

  <script src="js/config.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/renderer.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
